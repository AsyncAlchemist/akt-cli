name: Release (integration)

# Full-surface integration tests against a LIVE Akaunting deployment. Creates real
# records and deletes them on teardown — but Akaunting soft-deletes, so each run
# still leaves orphaned ledger rows behind, and the suite runs `coa sync` which can
# mutate the chart of accounts. It must therefore NOT run against a shared/prod
# instance on every release: that pollutes the books and makes releases flaky on a
# transient network blip (publishing is handled separately by publish.yml).
#
# Run it ON DEMAND only (workflow_dispatch). TODO: point AKT_BASE_URL at a
# disposable/staging instance and restore an automatic trigger.
on:
  workflow_dispatch:

permissions:
  contents: read

# never run two live suites at once (avoids state races on the shared instance)
concurrency:
  group: integration-live
  cancel-in-progress: false

jobs:
  integration:
    name: Live integration tests
    runs-on: ubuntu-latest
    env:
      # Connection details come only from secrets; never hard-coded here.
      AKT_BASE_URL: ${{ secrets.AKT_BASE_URL }}
      AKT_EMAIL: ${{ secrets.AKT_EMAIL }}
      AKT_PASSWORD: ${{ secrets.AKT_PASSWORD }}
      # Pace requests to stay under host bot-protection / rate limits.
      AKT_THROTTLE: "0.5"
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync

      - name: Unit tests (sanity)
        run: uv run pytest tests/unit -q

      - name: Live integration tests
        run: uv run pytest tests/integration -v
